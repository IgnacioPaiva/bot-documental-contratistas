# n8n + Postgres + Cloudflare Tunnel en un VPS (Hetzner)
# Vive en el servidor en /opt/n8n/docker-compose.yml, junto a un .env (ver .env.example).
# Incluye el túnel de Cloudflare (cloudflared).

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    # Fijar la misma versión que el n8n de desarrollo, y actualizarlas juntas.
    image: docker.n8n.io/n8nio/n8n:2.29.8
    restart: unless-stopped
    # Sólo escucha dentro del servidor: desde internet se entra por el túnel, nunca directo.
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Sin esta clave no se pueden leer las credenciales guardadas. Copia en el gestor de contraseñas.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.tu-dominio.com
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.tu-dominio.com/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
      # Los archivos (PDFs, ZIPs del legajo) van al disco, no a la RAM: el servidor tiene 2 GB.
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      # Historial de ejecuciones: 30 días. El registro de accesos de cada bot va aparte, en su planilla.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 720
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    # Túnel saliente hacia Cloudflare: n8n.tu-dominio.com → http://n8n:5678.
    # La ruta se configura en el panel (Networking → Tunnels → <tu túnel>), no acá.
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
